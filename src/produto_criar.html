<!-- Formulário para cadastrar um novo produto -->
<div class="container">
    <h1>Cadastrar Novo Produto</h1>
    <form id="form-produto">
        <div class="form-group">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="preco">Preço:</label>
            <input type="number" id="preco" name="preco" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" name="quantidade" required>
        </div>

        <!-- NOVO CAMPO PARA IMAGEM -->
        <div class="form-group">
            <label for="imagemProduto">Imagem do Produto:</label>
            <input type="file" id="imagemProduto" name="imagemProduto" accept="image/png, image/jpeg, image/webp">
            <!-- Opcional: para mostrar uma prévia da imagem selecionada -->
            <img id="previewImagem" src="#" alt="Prévia da imagem" style="display: none; max-width: 200px; margin-top: 10px;">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Salvar Produto</button>
            <a href="#/produto_listar" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<!-- Script específico para esta página -->
<script>
    // Função auto-executável para evitar conflito de variáveis
    (function() {
        // Script para exibir a prévia da imagem
        const inputImagem = document.getElementById('imagemProduto');
        const previewImagem = document.getElementById('previewImagem');

        inputImagem.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImagem.src = e.target.result;
                    previewImagem.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // Lógica para lidar com o envio do formulário
        document.getElementById('form-produto').addEventListener('submit', async (event) => {
            event.preventDefault();

            const imagemInput = document.getElementById('imagemProduto');
            const imagemFile = imagemInput.files[0];

            let caminhoImagem = null; // Inicia como nulo
            if (imagemFile) {
                // Chama a função exposta no preload.js para salvar a imagem
                caminhoImagem = await window.api.salvarImagem(imagemFile.path);
            }

            const dadosProduto = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                quantidade: parseInt(document.getElementById('quantidade').value),
                caminho_imagem: caminhoImagem // Salva o caminho da imagem
            };

            await window.api.criarProduto(dadosProduto);
            alert('Produto salvo com sucesso!');
            window.location.hash = '#/produto_listar'; // Redireciona para a lista
        });
    })();
</script>
