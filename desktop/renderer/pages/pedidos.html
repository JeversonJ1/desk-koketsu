<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos</title>
  <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <img src="../assets/img/logo.jpg" class="logo">
    <nav class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="produtos.html">Produtos</a>
      <a href="clientes.html">Clientes</a>
      <a href="login.html">Sair</a>
    </nav>
  </aside>

  <main class="content">
    <div class="dashboard-header">
      <div>
        <h1>Novo Pedido</h1>
        <p>Selecione produtos e finalize</p>
      </div>
      <button class="btn btn-outline-secondary" id="btnLimparCarrinho">🗑️ Limpar Carrinho</button>
    </div>

    <div class="row">
      <!-- COLUNA ESQUERDA: PRODUTOS -->
      <div class="col-lg-8">
        <div class="card">
          <h3>📦 Produtos Disponíveis</h3>
          
          <!-- BUSCA -->
          <input type="text" id="searchProduto" class="form-control mb-3" placeholder="🔍 Buscar produto...">
          
          <!-- LISTA DE PRODUTOS -->
          <div id="listaProdutos" class="produtos-grid">
            <p class="text-muted">Carregando...</p>
          </div>
        </div>
      </div>

      <!-- COLUNA DIREITA: CARRINHO -->
      <div class="col-lg-4">
        <div class="card position-sticky" style="top: 20px;">
          <h3>🛒 Carrinho</h3>
          
          <!-- ITENS CARRINHO -->
          <div id="carrinhoItems" class="carrinho-container">
            <p class="text-muted text-center py-5">Nenhum item adicionado</p>
          </div>
          
          <!-- RESUMO -->
          <div class="carrinho-resumo">
            <div class="row">
              <div class="col-6"><strong>Itens:</strong></div>
              <div class="col-6 text-end"><span id="totalItens">0</span></div>
            </div>
            <div class="row mt-2">
              <div class="col-6"><strong>Subtotal:</strong></div>
              <div class="col-6 text-end"><span id="subtotal">R$ 0.00</span></div>
            </div>
            <hr>
            <div class="row">
              <div class="col-6"><h5>TOTAL:</h5></div>
              <div class="col-6 text-end"><h5 id="totalPedido" style="color: #ffd84d;">R$ 0.00</h5></div>
            </div>
          </div>
          
          <!-- BOTÕES -->
          <button class="btn btn-gold w-100 mt-3" id="btnFinalizar">✓ Finalizar Pedido</button>
          <button class="btn btn-outline-secondary w-100 mt-2" id="btnCancelar">✕ Cancelar</button>
        </div>

        <!-- HISTÓRICO PEDIDOS -->
        <div class="card mt-3">
          <h3>📋 Últimos Pedidos</h3>
          <div id="historicoPedidos" class="historico-container">
            <p class="text-muted text-center">Carregando...</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/pedidos.js"></script>
<script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
