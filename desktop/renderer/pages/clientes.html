<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes</title>
  <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .cliente-card {
      background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .cliente-card:hover {
      border-color: #ffd84d;
      box-shadow: 0 4px 12px rgba(255, 216, 77, 0.2);
      transform: translateY(-2px);
    }

    .cliente-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .cliente-dados {
      flex: 1;
    }

    .cliente-nome {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .cliente-detalhes {
      font-size: 13px;
      color: #888;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .cliente-detalhes span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .cliente-acoes {
      display: flex;
      gap: 8px;
    }

    #gridClientes {
      display: grid;
      gap: 12px;
    }

    .input-group-text {
      background: #1a1a1a;
      border-color: #444;
      color: #888;
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <img src="../assets/img/logo.jpg" class="logo">
    <nav class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="produtos.html">Produtos</a>
      <a class="active" href="clientes.html">Clientes</a>
      <a href="configuracoes.html">⚙️ Configurações</a>
      <a href="#" data-logout>Sair</a>
    </nav>
  </aside>

  <main class="content">
    <div class="dashboard-header">
      <div>
        <h1>Gerenciar Clientes</h1>
        <p>Administre seus clientes e histórico de compras</p>
      </div>
      <button class="btn btn-gold" id="btnNovoCliente">➕ Novo Cliente</button>
    </div>

    <!-- BUSCA E FILTRO -->
    <div class="card mb-4">
      <div class="row" style="gap: 12px;">
        <div class="col-md-4">
          <label style="font-size: 12px; color: #888; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">🔍 Buscar Cliente</label>
          <input type="text" id="searchCliente" class="form-control" placeholder="Nome ou email...">
        </div>
        <div class="col-md-3">
          <label style="font-size: 12px; color: #888; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">📍 Cidade</label>
          <select id="filterCidade" class="form-control">
            <option value="">Todas as cidades</option>
          </select>
        </div>
        <div class="col-md-3" style="display: flex; align-items: flex-end; gap: 8px;">
          <div style="flex: 1;">
            <label style="font-size: 12px; color: #888; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">🔀 Ordenar</label>
            <select id="ordenarPor" class="form-control">
              <option value="nome-az">Nome (A → Z)</option>
              <option value="nome-za">Nome (Z → A)</option>
              <option value="data-recente">Mais Recente</option>
              <option value="data-antigo">Mais Antigo</option>
            </select>
          </div>
          <button id="limparFiltros" class="btn btn-outline-secondary" style="padding: 10px 14px; font-size: 14px; font-weight: 600; border: 2px solid #555; border-radius: 8px; background: transparent; color: #fff; transition: all 0.3s; height: 42px;" title="Limpar todos os filtros">🔄</button>
        </div>
      </div>
    </div>

    <!-- GRID DE CLIENTES -->
    <div id="gridClientes">
      <p class="text-muted col-12">Carregando clientes...</p>
    </div>
  </main>
</div>

<!-- MODAL CLIENTE -->
<div class="modal" id="modalCliente" style="display: none;">
  <div class="modal-content" style="max-width: 600px;">
    <div class="modal-header" style="background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); padding: 20px 30px; border-bottom: 2px solid #ffd84d; border-radius: 12px 12px 0 0;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="background: #ffd84d; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px;">👤</div>
        <h2 style="margin: 0; color: #fff;" id="modalTitulo">Novo Cliente</h2>
      </div>
      <span class="close" id="cancelarModal" style="font-size: 28px; font-weight: bold; cursor: pointer; color: #888;">&times;</span>
    </div>
    <div class="modal-body" style="padding: 30px;">
      <div class="mb-3">
        <label class="form-label">Nome Completo *</label>
        <input type="text" id="nome" class="form-control" placeholder="Ex: João Silva" autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label">Email *</label>
        <input type="email" id="email" class="form-control" placeholder="Ex: joao@email.com" autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="tel" id="telefone" class="form-control" placeholder="Ex: 11 99999-9999" autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label">Endereço</label>
        <textarea id="endereco" class="form-control" rows="3" placeholder="Ex: Rua das Flores, 123 - São Paulo/SP" autocomplete="off"></textarea>
      </div>
    </div>
    <div class="modal-footer" style="padding: 20px 30px; border-top: 1px solid #333; display: flex; gap: 12px; justify-content: flex-end;">
      <button class="btn btn-outline-secondary" id="cancelarModalBtn">Cancelar</button>
      <button class="btn btn-gold" id="salvarCliente">💾 Salvar Cliente</button>
    </div>
  </div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/clientes.js"></script>
</body>
</html>
