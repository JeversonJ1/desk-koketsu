<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>
  <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(100%);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <img src="../assets/img/logo.jpg" class="logo">

    <nav class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="produtos.html">Produtos</a>
      <a href="clientes.html">Clientes</a>
      <a href="pedidos.html">Pedidos</a>
      <a class="active" href="configuracoes.html">Configurações</a>
      <a href="#" data-logout>Sair</a>
    </nav>
  </aside>

  <main class="content">
    <div class="dashboard-header">
      <div>
        <h1>Configurações</h1>
        <p>Gerencie credenciais e conteúdo do site</p>
      </div>
    </div>

    <!-- CONTAINER DE ABAS -->
    <div class="tabs-container" style="margin-bottom: 30px;">
      <div class="tabs-buttons" style="display: flex; gap: 12px; border-bottom: 2px solid #333; margin-bottom: 20px;">
        <button class="tab-btn active" data-tab="credenciais" style="padding: 12px 24px; background: transparent; border: none; color: #fff; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s;" onclick="mudarAba('credenciais')" onmouseover="this.style.color='#ffc107';" onmouseout="this.style.color='#fff';">
          Credenciais
        </button>
        <button class="tab-btn" data-tab="banners" style="padding: 12px 24px; background: transparent; border: none; color: #fff; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s;" onclick="mudarAba('banners')" onmouseover="this.style.color='#ffc107';" onmouseout="this.style.color='#fff';">
          Banners
        </button>
      </div>
    </div>

    <!-- ABA CREDENCIAIS -->
    <div id="credenciais" class="tab-content" style="display: block;">
      <div class="row">
        <div class="col-lg-6">
          <div class="card" style="background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); border: 1px solid #333; padding: 30px; border-radius: 12px;">
            <h3 style="color: #ffc107; margin-bottom: 25px; display: flex; align-items: center; gap: 12px;">
              Alterar Credenciais de Acesso
            </h3>
            
            <form id="formCredenciais">
              <div class="mb-3">
                <label class="form-label" style="color: #fff;">Login Atual *</label>
                <input type="text" id="loginAtual" class="form-control" placeholder="Digite seu login" autocomplete="off" style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px;">
              </div>

              <div class="mb-3">
                <label class="form-label" style="color: #fff;">Senha Atual *</label>
                <input type="password" id="senhaAtual" class="form-control" placeholder="Digite sua senha" autocomplete="off" style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px;">
              </div>

              <hr style="border-color: #333; margin: 30px 0;">

              <div class="mb-3">
                <label class="form-label" style="color: #ffc107; font-weight: 600;">Novo Login *</label>
                <input type="text" id="novoLogin" class="form-control" placeholder="Digite o novo login" autocomplete="off" style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px;">
              </div>

              <div class="mb-3">
                <label class="form-label" style="color: #ffc107; font-weight: 600;">Nova Senha *</label>
                <div style="position: relative;">
                  <input type="password" id="novaSenha" class="form-control" placeholder="Digite a nova senha (mín. 6 caracteres)" autocomplete="off" style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 40px 12px 15px; border-radius: 8px;">
                  <button type="button" id="toggleSenha" onclick="toggleSenhaVisibilidade()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: #888; cursor: pointer; font-size: 18px;" title="Mostrar/Ocultar senha">👁️</button>
                </div>
                <div id="forcaSenha" style="margin-top: 8px; display: none;">
                  <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                    <div class="forca-bar" style="flex: 1; height: 4px; background: #333; border-radius: 2px;"></div>
                    <div class="forca-bar" style="flex: 1; height: 4px; background: #333; border-radius: 2px;"></div>
                    <div class="forca-bar" style="flex: 1; height: 4px; background: #333; border-radius: 2px;"></div>
                    <div class="forca-bar" style="flex: 1; height: 4px; background: #333; border-radius: 2px;"></div>
                  </div>
                  <small id="forcaTexto" style="color: #888;">Digite uma senha</small>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label" style="color: #ffc107; font-weight: 600;">Confirmar Nova Senha *</label>
                <input type="password" id="confirmarSenha" class="form-control" placeholder="Confirme a nova senha" autocomplete="off" style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px;">
                <small id="senhaMatch" style="display: none; margin-top: 6px;"></small>
              </div>

              <button type="submit" class="btn btn-gold w-100" style="padding: 12px; font-weight: 600; margin-top: 20px;">Salvar Alterações</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- ABA BANNERS -->
    <div id="banners" class="tab-content" style="display: none;">
      <div class="row">
        <div class="col-lg-10">
          <div class="card" style="background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); border: 1px solid #333; padding: 30px; border-radius: 12px;">
            <h3 style="color: #ffc107; margin-bottom: 25px; display: flex; align-items: center; gap: 12px;">
              Gerenciar Banners do Site
            </h3>
            
            <!-- LISTA DE BANNERS EXISTENTES -->
            <div id="bannersList" style="margin-bottom: 40px; max-height: 400px; overflow-y: auto;"></div>

            <hr style="border-color: #333; margin: 30px 0;">

            <h4 style="color: #fff; margin-bottom: 20px;">Adicionar Novo Banner</h4>
            
            <form id="formBanners">
              <div class="mb-4">
                <label class="form-label" style="color: #fff; font-weight: 600;">Nome do Banner *</label>
                <input type="text" id="nomeBanner" class="form-control" placeholder="Ex: Promoção Verão, Black Friday" autocomplete="off" style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px;">
              </div>

              <div class="mb-4">
                <label class="form-label" style="color: #fff; font-weight: 600;">Imagem do Banner *</label>
                <div style="border: 2px dashed #ffc107; border-radius: 12px; padding: 40px; text-align: center; background: rgba(255,193,7,0.05); transition: all 0.3s; cursor: pointer;" id="dropZone" onclick="document.getElementById('imagemBanner').click();">
                  <input type="file" id="imagemBanner" accept="image/*" style="display: none;" onchange="previewBanner(this, 'previewNovo')">
                  <div style="font-size: 48px; margin-bottom: 15px; color: #ffc107;">⬆</div>
                  <div style="color: #ffc107; font-weight: 600; margin-bottom: 8px;">Clique ou arraste uma imagem</div>
                  <div style="color: #888; font-size: 13px;">PNG, JPG, GIF (máx. 5MB) • Recomendado: 1920x720px</div>
                  <img id="previewNovo" style="max-width: 100%; max-height: 260px; margin-top: 15px; border-radius: 8px; display: none; object-fit: cover;">
                  <div id="previewInfo" style="margin-top: 10px; color: #ddd; font-size: 12px; display:none;"></div>
                  <div id="simulacaoBanner" style="aspect-ratio: 8 / 3; width: 100%; border: 1px dashed #ffc107; margin-top: 12px; overflow: hidden; border-radius: 8px; display:none;">
                    <img id="simulacaoImg" style="width: 100%; height: 100%; object-fit: cover;" alt="Simulação do recorte">
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-gold w-100" style="padding: 12px; font-weight: 600; margin-top: 20px;">Adicionar Banner</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/auth.js"></script>
<script src="../js/configuracoes.js"></script>
<script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
