<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <img src="../assets/produtos/logo _sem_fundo.png" class="logo">
    <nav class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a class="active" href="produtos.html">Produtos</a>
      <a href="pedidos.html">Pedidos</a>
      <a href="#">Clientes</a>
      <a href="login.html">Sair</a>
    </nav>
  </aside>

  <main class="content">
    <div class="dashboard-header">
      <div>
        <h1>Estoque de Produtos</h1>
        <p>Gerencie seus produtos</p>
      </div>
      <button class="btn btn-gold" id="btnNovoProduto">➕ Novo Produto</button>
    </div>

    <!-- BUSCA E FILTRO -->
    <div class="card mb-4">
      <div class="row">
        <div class="col-md-8">
          <input type="text" id="searchProduto" class="form-control" placeholder="🔍 Buscar por nome ou categoria...">
        </div>
        <div class="col-md-4">
          <select id="filterCategoria" class="form-control">
            <option value="">Todas as categorias</option>
          </select>
        </div>
      </div>
    </div>

    <!-- GRID DE PRODUTOS -->
    <div id="gridProdutos" class="produtos-estoque-grid">
      <p class="text-muted col-12">Carregando produtos...</p>
    </div>

    <!-- RESUMO -->
    <div class="card mt-4">
      <div class="row text-center">
        <div class="col-md-4">
          <h6 class="text-muted">Total de Produtos</h6>
          <h3 id="totalProdutos" style="color: #ffd84d;">0</h3>
        </div>
        <div class="col-md-4">
          <h6 class="text-muted">Total em Estoque</h6>
          <h3 id="totalEstoque" style="color: #ffd84d;">0</h3>
        </div>
        <div class="col-md-4">
          <h6 class="text-muted">Valor Total</h6>
          <h3 id="valorTotal" style="color: #ffd84d;">R$ 0.00</h3>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL PRODUTO -->
<div class="modal" id="modalProduto" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitulo">Novo Produto</h3>
      <button class="btn-close-modal" id="cancelarModal">&times;</button>
    </div>

    <div class="modal-body">
      <div class="row">
        <div class="col-md-6">
          <label>Nome *</label>
          <input type="text" id="nome" class="form-control" placeholder="Nome do produto">

          <label class="mt-3">Categoria</label>
          <input type="text" id="categoria" class="form-control" placeholder="Ex: Roupas, Calçados">

          <label class="mt-3">Preço *</label>
          <input type="number" id="preco" class="form-control" placeholder="0.00" step="0.01" min="0">

          <label class="mt-3">Quantidade *</label>
          <input type="number" id="qtd" class="form-control" placeholder="0" min="0">
        </div>
        <div class="col-md-6">
          <label>Imagem</label>
          <input type="file" id="imagem" class="form-control" accept="image/*">
          <img id="preview" style="display:none; width: 100%; margin-top: 10px; border-radius: 6px;" alt="Pré-visualização">
          <p class="text-muted small mt-2">Formatos: JPG, PNG, WebP</p>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline-secondary" id="cancelarModalBtn">Cancelar</button>
      <button class="btn btn-gold" id="salvarProduto">Salvar Produto</button>
    </div>
  </div>
</div>
<script src="../js/produtos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
