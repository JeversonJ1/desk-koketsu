<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h1>Koketsu</h1>
    <nav class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="produtos.html" class="active">Produtos</a>
      <a href="#">Pedidos</a>
      <a href="#">Clientes</a>
      <a href="#" id="logout">Sair</a>
    </nav>
  </aside>

  <main class="content">
    <div class="content-header">
      <h2>Estoque de Produtos</h2>
      <button class="btn btn-gold" id="btnNovoProduto">+ Novo Produto</button>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Imagem</th>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Qtd</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaProdutos"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalProduto">
  <div class="modal">
    <h3>Novo Produto</h3>

    <label>Imagem</label>
    <input type="file" id="imagem" accept="image/*">
    <img id="preview" class="preview">

    <label>Nome</label>
    <input type="text" id="nome">

    <label>Categoria</label>
    <select id="categoria">
      <option>Roupas</option>
      <option>Calçados</option>
      <option>Acessórios</option>
    </select>

    <label>Preço</label>
    <input type="number" id="preco" step="0.01">

    <label>Quantidade</label>
    <input type="number" id="qtd">

    <div class="modal-actions">
      <button class="btn btn-gold" id="salvarProduto">Salvar</button>
      <button class="btn btn-danger" id="cancelarModal">Cancelar</button>
    </div>
  </div>
</div>

<script src="../js/auth.js"></script>
<script src="../js/produtos.js"></script>
</body>
</html>
