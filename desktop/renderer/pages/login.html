<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Koketsu</title>
  <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-container {
      background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
      border-radius: 15px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 216, 77, 0.2);
      padding: 50px 40px;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 216, 77, 0.1);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-container img {
      width: 240px;
      height: 240px;
      border-radius: 25px;
      box-shadow: 0 12px 40px rgba(255, 216, 77, 0.5);
      border: 5px solid #ffd84d;
      object-fit: cover;
    }
    .login-container h1 {
      color: #ffd84d;
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 10px rgba(255, 216, 77, 0.3);
    }
    .login-container p {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 14px;
      text-align: center;
    }
    .form-control {
      margin-bottom: 15px;
      height: 50px;
      border: 2px solid #3a3a3a;
      border-radius: 8px;
      font-size: 14px;
      background: #1a1a1a;
      color: #fff;
      transition: all 0.3s;
    }
    .form-control::placeholder {
      color: #666;
    }
    .form-control:focus {
      border-color: #ffd84d;
      box-shadow: 0 0 0 0.2rem rgba(255, 216, 77, 0.15);
      background: #1f1f1f;
      color: #fff;
    }
    .btn-login {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #ffd84d 0%, #ffb300 100%);
      border: none;
      color: #000;
      font-weight: 700;
      border-radius: 8px;
      margin-top: 20px;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255, 216, 77, 0.3);
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 216, 77, 0.5);
      color: #000;
      background: linear-gradient(135deg, #ffdc5e 0%, #ffc107 100%);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .alert {
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid;
    }
    .alert-danger {
      background: rgba(220, 53, 69, 0.1);
      color: #ff6b6b;
      border-color: rgba(220, 53, 69, 0.3);
    }
    .alert-success {
      background: rgba(40, 167, 69, 0.1);
      color: #51cf66;
      border-color: rgba(40, 167, 69, 0.3);
    }
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 216, 77, 0.2);
      border-top: 2px solid #ffd84d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-container">
      <img src="../assets/img/logo.jpg" alt="Koketsu Logo">
    </div>
    <h1>Koketsu</h1>
    <p>Acesso ao Sistema</p>
    
    <div id="alertContainer"></div>
    
    <form id="loginForm">
      <input 
        type="text" 
        id="username" 
        class="form-control" 
        placeholder="Usuário" 
        required 
        autocomplete="username"
      >
      <input 
        type="password" 
        id="password" 
        class="form-control" 
        placeholder="Senha" 
        required 
        autocomplete="current-password"
      >
      <button type="submit" class="btn btn-login" id="loginBtn">
        <span id="btnText">Entrar</span>
      </button>
    </form>
  </div>

  <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
